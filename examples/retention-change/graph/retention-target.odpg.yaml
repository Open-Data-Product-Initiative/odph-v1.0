schema: https://opendataproducts.org/odpg-v1.0/schema/odpg.yaml
version: '1.0'
kind: Graph
graph:
  metadata:
    id: retention-target
    name: {en: Retention intervention target graph}
    description: >-
      Customer Insights owns a governed retention objective and preventable-
      churn use case. Customer Retention Signals supports the decision path.
  nodes:
    - id: retention-objective
      type: BusinessObjective
      $ref: ../artefacts/retention-objective.odpc.yaml#/catalog/businessObjectives/0
    - id: preventable-churn-use-case
      type: UseCase
      $ref: ../artefacts/preventable-churn-use-case.odpc.yaml#/catalog/useCases/0
    - id: customer-retention-signals
      type: DataProduct
      $ref: ../artefacts/customer-retention-signals.odps.yaml
  edges:
    - {from: preventable-churn-use-case, to: retention-objective, type: supports, confidence: high}
    - {from: preventable-churn-use-case, to: customer-retention-signals, type: uses, confidence: high}
    - {from: customer-retention-signals, to: retention-objective, type: contributesTo, confidence: high}
