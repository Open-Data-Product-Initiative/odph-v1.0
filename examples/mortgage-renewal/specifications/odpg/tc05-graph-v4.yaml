schema: https://opendataproducts.org/odpg-v1.0/schema/odpg.yaml
version: '1.0'
kind: Graph
graph:
  metadata:
    id: mortgage-renewal-graph
    name: {en: Mortgage renewal graph}
    description: {en: Graph revision 4 adds the customer profile and marks the former eligibility version as deprecated.}
  nodes:
    - {id: mortgage-renewal-retention, type: BusinessObjective, $ref: ../odpc/tc01-objective-v1.yaml#/catalog/businessObjectives/0}
    - {id: prioritise-mortgage-renewal-outreach, type: UseCase, $ref: ../odpc/tc04-use-case-v1.yaml#/catalog/useCases/0}
    - {id: mortgage-renewal-customer-profile, type: DataProduct, $ref: ../odps/tc05-customer-profile-v1.yaml}
    - {id: mortgage-renewal-eligibility, type: DataProduct, $ref: ../odps/tc05-eligibility-v3-deprecated.yaml}
  edges:
    - {from: prioritise-mortgage-renewal-outreach, to: mortgage-renewal-retention, type: supports, confidence: high}
    - {from: prioritise-mortgage-renewal-outreach, to: mortgage-renewal-customer-profile, type: uses, confidence: high}
    - {from: mortgage-renewal-customer-profile, to: mortgage-renewal-retention, type: contributesTo, confidence: medium}
