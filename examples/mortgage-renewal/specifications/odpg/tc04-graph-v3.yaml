schema: https://opendataproducts.org/odpg-v1.0/schema/odpg.yaml
version: '1.0'
kind: Graph
graph:
  metadata:
    id: mortgage-renewal-graph
    name: {en: Mortgage renewal graph}
    description: {en: Graph revision 3 adds the outreach use case.}
  nodes:
    - {id: mortgage-renewal-retention, type: BusinessObjective, $ref: ../odpc/tc01-objective-v1.yaml#/catalog/businessObjectives/0}
    - {id: plan-mortgage-renewals, type: UseCase, $ref: ../odpc/tc01-use-case-v1.yaml#/catalog/useCases/0}
    - {id: prioritise-mortgage-renewal-outreach, type: UseCase, $ref: ../odpc/tc04-use-case-v1.yaml#/catalog/useCases/0}
    - {id: mortgage-renewal-eligibility, type: DataProduct, $ref: ../odps/tc03-eligibility-v2.yaml}
  edges:
    - {from: plan-mortgage-renewals, to: mortgage-renewal-retention, type: supports, confidence: high}
    - {from: prioritise-mortgage-renewal-outreach, to: mortgage-renewal-retention, type: supports, confidence: high}
    - {from: prioritise-mortgage-renewal-outreach, to: mortgage-renewal-eligibility, type: uses, confidence: high}
