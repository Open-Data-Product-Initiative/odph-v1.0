        - source_evidence_missing_stale_or_contradictory
        - deterministic_validation_or_policy_control_failed
      triggerThresholds:
        repeatedCorrectionRejectionOrSafetyFailureThreshold: 3
      severity: high
      immediateAction: disable_execution
      evidenceRequirements:
        - Record trigger, affected scope, source references, and local validation result.
      notificationTargets: [Service Owner, Policy Owner, Security Officer]
      restorationRequirements:
        - A future platform restoration uses a new attributable decision record.
      expiryOrReviewDate: "2026-12-01T00:00:00Z"
      localStatus: declared_active
