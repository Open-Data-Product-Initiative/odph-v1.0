schema: https://opendataproducts.org/odpg-v1.0/schema/odpg.yaml
version: '1.0'
kind: Graph
graph:
  metadata:
    id: example-change-graph
    name: {en: Example change graph}
    description: {en: Graph revision 1 connecting the first objective and use case.}
  nodes:
    - id: service-outcome-objective
      type: BusinessObjective
      $ref: ../odpc/tc01-objective-v1.yaml#/catalog/businessObjectives/0
