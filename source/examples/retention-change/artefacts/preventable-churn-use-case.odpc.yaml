schema: https://opendataproducts.org/odpc-v1.0/schema/odpc.yaml
version: '1.0'
kind: Catalog
catalog:
  metadata:
    id: preventable-churn-use-case-catalog
    name: {en: Preventable churn use case catalog}
    description: {en: Governed use case for preventable customer churn decisions.}
  useCases:
    - id: preventable-churn-use-case
      name: {en: Prevent preventable customer churn}
      description: {en: "Defines the target population, value hypothesis, and success measures for retention work."}
