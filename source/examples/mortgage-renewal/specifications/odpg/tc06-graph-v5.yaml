schema: https://opendataproducts.org/odpg-v1.0/schema/odpg.yaml
version: '1.0'
kind: Graph
graph:
  metadata:
    id: mortgage-renewal-graph
    name: {en: Mortgage renewal graph}
    description: {en: Graph revision 5 connects the mortgage-outreach planning change.}
  nodes:
    - {id: mortgage-renewal-retention, type: BusinessObjective, $ref: ../odpc/tc01-objective-v1.yaml#/catalog/businessObjectives/0}
    - {id: mortgage-renewal-outreach-capacity, type: BusinessObjective, $ref: ../odpc/tc06-objective-v1.yaml#/catalog/businessObjectives/0}
    - {id: plan-mortgage-outreach-capacity, type: UseCase, $ref: ../odpc/tc06-use-case-v1.yaml#/catalog/useCases/0}
    - {id: mortgage-renewal-offer-eligibility, type: DataProduct, $ref: ../odps/tc06-offer-eligibility-v1.yaml}
    - {id: mortgage-outreach-capacity-forecast, type: DataProduct, $ref: ../odps/tc06-outreach-capacity-forecast-v1.yaml}
    - {id: mortgage-renewal-customer-profile, type: DataProduct, $ref: ../odps/tc05-customer-profile-v1.yaml}
  edges:
    - {from: plan-mortgage-outreach-capacity, to: mortgage-renewal-outreach-capacity, type: supports, confidence: high}
    - {from: plan-mortgage-outreach-capacity, to: mortgage-renewal-offer-eligibility, type: uses, confidence: high}
    - {from: plan-mortgage-outreach-capacity, to: mortgage-outreach-capacity-forecast, type: uses, confidence: high}
    - {from: mortgage-renewal-offer-eligibility, to: mortgage-renewal-retention, type: contributesTo, confidence: medium}
    - {from: mortgage-outreach-capacity-forecast, to: mortgage-renewal-outreach-capacity, type: contributesTo, confidence: high}
